<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Ventes</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0;--mut:#94a3b8;--acc:#6366f1}
body.light{--bg:#f1f5f9;--card:#fff;--txt:#0f172a;--mut:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:1.3rem;margin:0}
select,button{background:var(--card);color:var(--txt);border:1px solid var(--mut);border-radius:8px;padding:8px 10px;font-size:.9rem}
button{cursor:pointer;background:var(--acc);border:0;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi,.card{background:var(--card);border-radius:14px;padding:14px;animation:in .6s both}
.kpi small{color:var(--mut)}
.kpi b{display:block;font-size:1.5rem;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card h3{margin:0 0 8px;font-size:1rem}
@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
<h1>📊 Dashboard Ventes 2026</h1>
<div>
<select id="reg" onchange="maj()"><option>Toutes</option><option>Nord</option><option>Sud</option><option>Est</option><option>Ouest</option><option>Centre</option></select>
<select id="cat" onchange="maj()"><option>Toutes</option><option>Électronique</option><option>Mode</option><option>Maison</option><option>Sport</option><option>Beauté</option></select>
<button onclick="live()">▶ Ventes en direct</button>
<button onclick="document.body.classList.toggle('light')">🌓</button>
</div>
</header>
<div class="kpis">
<div class="kpi"><small>Chiffre d'affaires</small><b id="k1">0</b></div>
<div class="kpi"><small>Commandes</small><b id="k2">0</b></div>
<div class="kpi"><small>Panier moyen</small><b id="k3">0</b></div>
<div class="kpi"><small>Meilleur mois</small><b id="k4">-</b></div>
</div>
<div class="grid">
<div class="card"><h3>Évolution mensuelle</h3><canvas id="c1"></canvas></div>
<div class="card"><h3>Par catégorie</h3><canvas id="c2"></canvas></div>
<div class="card"><h3>Par région</h3><canvas id="c3"></canvas></div>
</div>
<script>
const M=["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
const R=["Nord","Sud","Est","Ouest","Centre"];
const C=["Électronique","Mode","Maison","Sport","Beauté"];
let s=7;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
let D=[];
for(let m=0;m<12;m++)for(const r of R)for(const c of C)
D.push({m,r,c,ca:Math.round(2000+rnd()*6000+m*150),n:Math.round(20+rnd()*60)});
const col=["#6366f1","#22c55e","#f59e0b","#ef4444","#06b6d4"];
const mk=(id,type,opt={})=>new Chart(document.getElementById(id),{type,data:{labels:[],datasets:[{data:[],backgroundColor:col,borderColor:"#6366f1",fill:true,tension:.4}]},options:{animation:{duration:900},plugins:{legend:{display:type!=="line"&&type!=="bar"}},...opt}});
const c1=mk("c1","line"),c2=mk("c2","doughnut"),c3=mk("c3","bar");
function anim(el,v){const t0=performance.now();(function f(t){const p=Math.min((t-t0)/800,1);el.textContent=Math.round(v*p).toLocaleString("fr-FR");if(p<1)requestAnimationFrame(f)})(t0)}
function maj(){
const r=reg.value,c=cat.value;
const d=D.filter(x=>(r=="Toutes"||x.r==r)&&(c=="Toutes"||x.c==c));
const ca=d.reduce((a,x)=>a+x.ca,0),n=d.reduce((a,x)=>a+x.n,0);
anim(k1,ca);anim(k2,n);anim(k3,Math.round(ca/n));
const pm=M.map((_,i)=>d.filter(x=>x.m==i).reduce((a,x)=>a+x.ca,0));
k4.textContent=M[pm.indexOf(Math.max(...pm))];
const grp=(L,key)=>L.map(l=>d.filter(x=>x[key]==l).reduce((a,x)=>a+x.ca,0));
const set=(ch,l,v)=>{ch.data.labels=l;ch.data.datasets[0].data=v;ch.update()};
set(c1,M,pm);set(c2,C,grp(C,"c"));set(c3,R,grp(R,"r"));
}
let t=null;
function live(){
if(t){clearInterval(t);t=null;return}
t=setInterval(()=>{D[Math.floor(rnd()*D.length)].ca+=Math.round(300+rnd()*1500);maj()},1500)}
maj();
</script>
</body>
</html>
